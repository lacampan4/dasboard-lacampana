  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

        e.target.tagName, String(e.target.src || e.target.href || ''));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {

              const { done, value } = await reader.read();

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const resourceMap = {};

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

left:0;top:0;bottom:0;width:3px;background:var(--acc)}\n\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}\n.phead{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}\n.phead h2{font-family:'Oswald';font-weight:500;font-size:15px;letter-spacing:.6px;text-transform:uppercase}\n.phead .hint{color:var(--txt3);font-size:12px;font-family:'IBM Plex Mono'}\n.tscroll{max-height:640px;overflow:auto}\ntable{width:100%;border-collapse:collapse;font-size:12.5px}\nthead th{position:sticky;top:0;background:var(--panel2);z-index:2;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--txt3);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line2);user-select:none;white-space:nowrap}\nthead th.tl,td.tl{text-align:left}\ntbody td{padding:8px 10px;border-bottom:1px solid var(--bg2);text-align:right;font-family:'IBM Plex Mono';font-size:12px;white-space:nowrap}\ntbody td.tl{font-family:'Archivo';white-space:normal}\ntbody tr.frow{cursor:pointer}\ntbody tr.frow:hover{background:var(--panel2)}\ntd .art{line-height:1.25}\ntd .art .cd{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--txt3)}\ntd .art .ds{font-size:12px}\n.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-family:'IBM Plex Mono';font-size:10.5px;font-weight:600}\n.pill.ok{background:rgba(31,138,91,.13);color:var(--green)}\n.pill.warn{background:rgba(217,146,10,.16);color:var(--amber)}\n.pill.bad{background:rgba(225,6,0,.11);color:var(--red)}\n.pill.mut{background:var(--bg2);color:var(--txt3)}\n.foot-note{padding:11px 17px;font-size:11.5px;color:var(--txt3);border-top:1px solid var(--bg2)}\n\n/* detalle factura */\ntr.detrow>td{background:var(--panel2);padding:0 10px 12px 34px;white-space:normal}\n.dettbl{margin-top:4px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}\n.dettbl thead th{position:static;background:var(--bg2)}\n.dettbl tbody td{border-bottom:1px solid var(--bg2)}\n\n/* acciones */\n.actcell{white-space:nowrap}\n.vsel{background:var(--bg2);border:1px solid var(--line2);color:var(--txt);font-family:'IBM Plex Mono';font-size:11.5px;padding:6px 8px;border-radius:7px}\n.vsel:focus{outline:none;border-color:var(--acc)}\n.mini{background:linear-gradient(145deg,var(--acc),var(--ferrari-dk));border:none;color:#fff;font-family:'Oswald';font-weight:600;font-size:11px;letter-spacing:.4px;text-transform:uppercase;padding:6px 10px;border-radius:7px;cursor:pointer;margin-left:5px}\n.mini:hover{filter:brightness(1.08)}\n.mini.ok{background:var(--green)}\n.mini.gh{background:var(--panel);border:1px solid var(--line2);color:var(--txt2)}\n.mini.gh:hover{border-color:var(--acc);color:var(--acc)}\n.plc{font-family:'IBM Plex Mono';font-size:11.5px;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;font-weight:600}\n\n/* métricas */\n.metgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n@media(max-width:980px){.metgrid{grid-template-columns:1fr}}\n.bar{display:inline-block;width:100%;max-width:190px;height:9px;background:var(--bg);border-radius:5px;position:relative;overflow:hidden;vertical-align:middle}\n.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:5px}\n\n/* flota modal */\n.flrow{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--bg2);font-size:12.5px}\n.flrow span{color:var(--txt2);flex:1}\n.fladd{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}\n.fladd input{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;font-family:'IBM Plex Mono';font-size:12.5px;color:var(--txt)}\n.fladd input:focus{outline:none;border-color:var(--acc)}\n\n/* modal */\n.overlay{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:5vh 18px;overflow:auto}\n.overlay.open{display:flex}\n.modal{background:var(--panel);border-radius:16px;max-width:980px;width:100%;box-shadow:0 24px 80px rgba(20,22,26,.35)}\n.modal.sm{max-width:560px}\n.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}\n.mhead h2{font-family:'Oswald';font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.5px}\n.mhead .x{background:none;border:none;font-size:22px;color:var(--txt3);cursor:pointer;line-height:1}\n.mhead .x:hover{color:var(--acc)}\n.mbody{padding:18px 20px}\n.mbody textarea{width:100%;height:230px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:12px;font-family:'IBM Plex Mono';font-size:11.5px;color:var(--txt);resize:vertical}\n.mbody textarea:focus{outline:none;border-color:var(--acc)}\n.mbody .cols{font-size:11.5px;color:var(--txt2);margin-bottom:9px;line-height:1.55}\n.mbody .cols code{background:var(--bg2);border-radius:5px;padding:1px 6px;font-family:'IBM Plex Mono';font-size:10.5px}\n.istatus{font-family:'IBM Plex Mono';font-size:12px;margin-top:9px;min-height:18px}\n.istatus.ok{color:var(--green)}.istatus.err{color:var(--red)}\n.mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}\n\n/* guía */\n.guia{max-width:900px;line-height:1.6;font-size:13.5px;color:var(--txt)}\n.guia h3{font-family:'Oswald';font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.5px;margin:22px 0 8px;color:var(--acc2)}\n.guia h3:first-child{margin-top:0}\n.guia p{margin:7px 0;color:var(--txt2)}\n.guia ol,.guia ul{margin:7px 0 7px 22px;color:var(--txt2)}\n.guia li{margin:4px 0}\n.guia code{background:var(--bg2);border-radius:5px;padding:1px 7px;font-family:'IBM Plex Mono';font-size:11.5px;color:var(--txt)}\n.guia table{border:1px solid var(--line2);margin:9px 0;font-size:12px}\n.guia th,.guia td{border:1px solid var(--line2);padding:6px 10px;text-align:left;font-family:'IBM Plex Mono';font-size:11.5px}\n.guia th{background:var(--panel2);position:static;cursor:default;text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--txt)}\n.guia .note{background:rgba(225,6,0,.05);border:1px solid rgba(225,6,0,.18);border-radius:9px;padding:10px 13px;font-size:12.5px;color:var(--txt2);margin:10px 0}\n\n.printhead{display:none}\n.printonly{display:none}\n@media print{\n  @page{size:A4 landscape;margin:0}\n  html,body{background:#fff !important;color:#15191f !important}\n  .noprint{display:none !important}\n  .printonly{display:inline}\n  .wrap{max-width:none;padding:9mm 10mm 10mm}\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  .printhead{display:flex !important;align-items:center;gap:13px;border-bottom:2.5px solid var(--ferrari);padding-bottom:10px;margin-bottom:13px}\n  .printhead img{height:36px;width:auto;border-radius:6px}\n  .printhead .ph-t{font-family:'Oswald';font-weight:600;font-size:16px;letter-spacing:.5px;color:#15191f}\n  .printhead .ph-t span{color:var(--ferrari)}\n  .printhead .ph-s{font-family:'IBM Plex Mono';font-size:10.5px;color:#5a6066;margin-top:3px}\n  .panel{border:1px solid #d4dae2 !important;box-shadow:none;break-inside:auto}\n  .tscroll{max-height:none !important;overflow:visible !important}\n  thead th{position:static}\n  tbody tr{break-inside:avoid}\n}\n</style>\n</head>\n<body>\n\n<div class=\"wrap\">\n  <div class=\"printhead\">\n    <img src=\"cf5a7452-29d1-4b8c-bd20-7b7188299d0d\" alt=\"La Campana\">\n    <div>\n      <div class=\"ph-t\">HOJA DE <span>DESPACHO</span> · FACTURAS DEL DÍA</div>\n      <div class=\"ph-s\" id=\"printSub\">—</div>\n    </div>\n  </div>\n\n  <header class=\"noprint\">\n    <div class=\"brand\">\n      <img class=\"logo\" src=\"cf5a7452-29d1-4b8c-bd20-7b7188299d0d\" alt=\"La Campana\">\n      <div>\n        <h1>HOJA DE <span>DESPACHO</span></h1>\n        <div class=\"sub\">Facturas del día · asignación de vehículos · kilos entregados</div>\n      </div>\n    </div>\n    <div class=\"htools\"><button class=\"btn ghost\" id=\"backMenuBtn\" title=\"Volver al menu\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 6h16M4 12h16M4 18h16\"></path></svg> Menu</button>\n      <button class=\"btn ghost\" onclick=\"openGuia()\">Guía de datos</button>\n      <button class=\"btn ghost\" onclick=\"openFlota()\">Flota</button>\n      <button class=\"btn ghost\" onclick=\"openImport()\">Importar facturas</button>\n      <button class=\"btn\" onclick=\"printDespacho()\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z\"></path></svg>\n        Imprimir hoja\n      </button>\n    \n      <button class=\"btn\" id=\"excelBtn\" onclick=\"openImport()\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2\"></path></svg> Cargar Excel</button>\n      <button class=\"btn ghost\" type=\"button\" id=\"updateSapBtn\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 12a8 8 0 0 1 13.7-5.7L20 9\"></path><path d=\"M20 4v5h-5\"></path><path d=\"M20 12a8 8 0 0 1-13.7 5.7L4 15\"></path><path d=\"M4 20v-5h5\"></path></svg> Actualizar desde SAP</button>\n    </div>\n  </header>\n\n  \n  <div class=\"demobar noprint\" id=\"demobar\" style=\"display:none\">\n    <b>Datos demo</b> Estás viendo facturas de ejemplo. Importa tus facturas reales de SAP con «Importar facturas».\n  </div>\n\n  <div class=\"params noprint\" id=\"params\"></div>\n\n  <div class=\"kpis\" id=\"kpis\"></div>\n\n  <div class=\"panel\">\n    <div class=\"phead\">\n      <h2 id=\"tblTitle\">Facturas del día</h2>\n      <div class=\"hint\" id=\"tblHint\"></div>\n    </div>\n    <div class=\"tscroll\"><table id=\"tbl\"></table></div>\n    <div class=\"foot-note noprint\" id=\"tblFoot\"></div>\n  </div>\n\n  <div class=\"panel\">\n    <div class=\"phead\">\n      <h2>Kilos entregados en el mes</h2>\n      <div class=\"seg noprint\" id=\"mesSeg\"></div>\n      <div class=\"hint\" id=\"mesHint\"></div>\n    </div>\n    <div class=\"metgrid\" style=\"padding:16px\">\n      <div>\n        <div class=\"phead\" style=\"padding:0 0 10px;border:none\"><h2 style=\"font-size:13px\">Por vehículo</h2></div>\n        <table id=\"vehTbl\"></table>\n      </div>\n      <div>\n        <div class=\"phead\" style=\"padding:0 0 10px;border:none\"><h2 style=\"font-size:13px\">Por grupo de artículos</h2></div>\n        <table id=\"grpTbl\"></table>\n      </div>\n    </div>\n    <div class=\"foot-note\">Solo suma facturas con estado <b>entregada</b>. El grupo sale de la categoría del artículo en cada línea de la factura.</div>\n  </div>\n</div>\n\n<!-- Import modal -->\n<div class=\"overlay noprint\" id=\"impOverlay\">\n  <div class=\"modal\">\n    <div class=\"mhead\"><h2>Importar facturas</h2><button class=\"x\" onclick=\"closeImport()\">×</button></div>\n    <div class=\"mbody\">\n      <div class=\"cols\"><b>Una fila por línea de factura.</b> Columnas esperadas:\n        <code>Factura</code> · <code>Fecha</code> · <code>Cliente</code> · <code>Dirección</code> · <code>Asesor</code> · <code>Correo</code> (opcional) ·\n        <code>Material/Código</code> · <code>Texto breve</code> · <code>Grupo</code> · <code>Cantidad</code> y/o <code>Kilos</code>.\n        Exporte de <code>VF05N</code> o query SQVI — ver Guía de datos.</div>\n      <textarea id=\"ita\" placeholder=\"Copia el rango en Excel (con encabezados) y pégalo aquí…\"></textarea>\n      <div style=\"display:flex;gap:10px;align-items:center;margin-top:9px\">\n        <button class=\"btn ghost\" style=\"padding:8px 13px\" onclick=\"impParse()\">Validar datos</button>\n        <div class=\"istatus\" id=\"ist\"></div>\n      </div>\n    </div>\n    <div class=\"mfoot\">\n      <button class=\"btn ghost\" onclick=\"resetDemoDespacho()\">Volver a datos demo</button>\n      <button class=\"btn\" onclick=\"saveImport()\">Guardar facturas</button>\n    </div>\n  </div>\n</div>\n\n<!-- Flota modal -->\n<div class=\"overlay noprint\" id=\"flOverlay\">\n  <div class=\"modal sm\">\n    <div class=\"mhead\"><h2>Flota de vehículos</h2><button class=\"x\" onclick=\"closeFlota()\">×</button></div>\n    <div class=\"mbody\">\n      <div id=\"flList\"></div>\n      <div class=\"fladd\">\n        <input id=\"flPlaca\" type=\"text\" placeholder=\"Placa · ABC 123\" style=\"width:150px\" maxlength=\"8\">\n        <input id=\"flDesc\" type=\"text\" placeholder=\"Descripción (opcional)\" style=\"flex:1;min-width:180px\">\n        <button class=\"btn\" style=\"padding:9px 14px\" onclick=\"addPlaca()\">Agregar</button>\n      </div>\n    </div>\n    <div class=\"mfoot\"><button class=\"btn\" onclick=\"closeFlota()\">Listo</button></div>\n  </div>\n</div>\n\n<!-- Guía de datos -->\n<div class=\"overlay\" id=\"guiaOverlay\">\n  <div class=\"modal\">\n    <div class=\"mhead\"><h2>Guía · Facturas SAP para la Hoja de Despacho</h2><button class=\"x\" onclick=\"closeGuia()\">×</button></div>\n    <div class=\"mbody guia\">\n      <h3>Qué necesita este dashboard</h3>\n      <p>Un exporte diario de las <b>facturas del día con sus posiciones</b> (una fila por artículo facturado), con cliente, dirección de entrega, asesor, cantidades y kilos.</p>\n\n      <h3>Opción A — VF05N (lista de facturas)</h3>\n      <ol>\n        <li>Transacción <code>VF05N</code>, marca <b>Con posiciones</b>.</li>\n        <li><b>Fecha de factura</b>: el día de hoy (o el rango que quieras cargar).</li>\n        <li>Layout (<code>Ctrl+F8</code>) con: <b>Documento de facturación, Fecha, Solicitante (nombre), Material, Denominación, Grupo de artículos, Cantidad facturada, Peso neto</b>.</li>\n        <li>Exporta: Sistema → Lista → Grabar → Fichero local → <b>Hoja de cálculo</b>.</li>\n      </ol>\n      <p>Si el layout no trae la dirección de entrega o el asesor, agrégalos en Excel antes de pegar (columnas «Dirección» y «Asesor»), o usa la opción B.</p>\n\n      <h3>Opción B — SQVI / Query Z (recomendada para automatizar)</h3>\n      <p>QuickView que una <code>VBRK</code> (cabecera de factura) con <code>VBRP</code> (posiciones), <code>KNA1/ADRC</code> (cliente y dirección del destinatario de mercancía) y <code>VBPA</code> (interlocutor <b>empleado responsable</b> = asesor). Campos: Factura (<code>VBELN</code>), Fecha (<code>FKDAT</code>), Cliente, Dirección, Asesor, Material, Denominación, Grupo de artículos (<code>MATKL</code> o categoría propia), Cantidad (<code>FKIMG</code>), Peso neto (<code>NTGEW</code>). Guárdalo como variante y expórtalo cada mañana en un clic.</p>\n\n      <h3>Formato que espera el importador</h3>\n      <table><tbody><tr><th>Factura</th><th>Fecha</th><th>Cliente</th><th>Dirección</th><th>Asesor</th><th>Correo</th><th>Material</th><th>Texto breve</th><th>Grupo</th><th>Cantidad</th><th>Kilos</th></tr>\n      <tr><td>901234</td><td>10.07.2026</td><td>FERRETERÍA X</td><td>Cl 44 # 19-23, Valledupar</td><td>CARLOS MEJÍA</td><td>carlos@…</td><td>GAL1.10UP12192440</td><td>LAMINA GALVANIZADA…</td><td>GALVANIZADA</td><td>20</td><td>520</td></tr></tbody></table>\n      <p>Los nombres de columna son flexibles. Fechas aceptadas: <code>dd.mm.aaaa</code>, <code>dd/mm/aaaa</code>, <code>aaaa-mm-dd</code>. La columna Correo es opcional: si no viene, el correo se abre sin destinatario y lo completas al enviar.</p>\n\n      <h3>Cómo funciona el flujo</h3>\n      <ul>\n        <li><b>Pendiente → Asignada:</b> eliges la placa del vehículo y pulsas «Asignar». Se abre tu correo (Outlook/Gmail) con el mensaje al asesor ya redactado: factura, cliente, dirección, detalle y placa. Solo pulsas enviar.</li>\n        <li><b>Asignada → Entregada:</b> cuando el vehículo regresa, marcas «Entregada». Solo las entregadas suman en las métricas de kilos del mes.</li>\n        <li><b>Flota:</b> las placas se administran en el botón «Flota» y quedan guardadas en este equipo, igual que las asignaciones.</li>\n      </ul>\n    </div>\n    <div class=\"mfoot\">\n      <button class=\"btn\" onclick=\"closeGuia()\">Entendido</button>\n    </div>\n  </div>\n</div>\n\n<script src=\"bfcfd027-262f-4f41-a6a0-943fd72ecbc9\"><\/script>\n<script src=\"684a6d99-d6f2-4fb8-a0cd-e46a2ac3c44e\"><\/script>\n<script src=\"de756311-682a-4437-b982-e43b1dbefefa\"><\/script>\n<script src=\"d06e5815-5f91-46f5-a227-e32907048ffe\"><\/script>\n\n\n<script id=\"back-menu-script\">\n(function(){\n  var b=document.getElementById('backMenuBtn');\n  if(b) b.addEventListener('click', function(){ window.location.href='menu.html'; });\n})();\n<\/script>\n</body></html>"</script>
