<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c9151e">
<title>La Campana · Acceso</title><link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Nunito,Arial,sans-serif}
:root{--red:#c9151e;--red-dark:#aa1017;--text:#202326;--muted:#777d82;--border:#d8dadd}
body{
  min-height:100vh;background:
  radial-gradient(circle at 50% 15%,rgba(255,255,255,.08),transparent 28%),
  linear-gradient(145deg,#c9151e 0%,#d20e16 52%,#b60e15 100%);
  display:flex;align-items:center;justify-content:center;
  overflow-x:hidden;padding:28px;
}

.page{width:min(100%,420px);position:relative;z-index:2}
.brand{text-align:center;margin-bottom:30px}
.logo{width:min(300px,78vw);height:auto;display:block;margin:0 auto}
.title{text-align:center;color:#fff;margin-bottom:20px}
.title h1{margin:0;font-size:25px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.title p{margin:7px 0 0;color:rgba(255,255,255,.82);font-size:13px}
.card{
  background:#f8f8f8;border-radius:16px;padding:36px 28px 34px;min-height:390px;
  box-shadow:0 20px 50px rgba(92,0,6,.28);
}
.card h2{margin:0;color:var(--text);font-size:21px;line-height:1.2;font-weight:800}
.card .sub{margin:7px 0 22px;color:#73787d;font-size:12px;line-height:1.45}
.field{margin-bottom:15px}
label{display:block;margin-bottom:7px;font-size:11px;font-weight:600;color:#5d6267}
.input-wrap{position:relative}
input{
  width:100%;height:50px;border:1px solid #cfd2d5;border-radius:8px;
  background:#fff;padding:0 45px 0 13px;color:#202326;font-size:13px;outline:none;
  transition:border-color .18s,box-shadow .18s;
}
input::placeholder{color:#a0a4a8}
input:focus{border-color:#b7babe;box-shadow:0 0 0 3px rgba(201,21,30,.08)}
.toggle-password{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  border:0;background:none;color:#8a8e92;font-size:10px;font-weight:700;
  cursor:pointer;padding:4px;text-transform:uppercase;
}
.login-button{
  width:100%;height:49px;border:0;border-radius:8px;background:var(--red);
  color:#fff;font-size:13px;font-weight:800;cursor:pointer;margin-top:2px;
  box-shadow:0 6px 14px rgba(201,21,30,.20);transition:.18s;
}
.login-button:hover{background:var(--red-dark);transform:translateY(-1px)}
.login-button:disabled{opacity:.65;cursor:wait;transform:none}
.forgot{
  display:block;text-align:center;margin-top:13px;color:#6e7377;
  font-size:11px;text-decoration:none;
}
.forgot:hover{color:var(--red)}
.error{
  display:none;margin-top:12px;padding:9px 10px;border-radius:7px;
  background:#fff0f1;border:1px solid #edc2c5;color:#9d1017;
  text-align:center;font-size:11px;
}
.footer{text-align:center;color:rgba(255,255,255,.75);font-size:9px;margin-top:18px;letter-spacing:.04em}
@media(max-width:520px){
  body{padding:18px 14px}
  .page{width:100%}
  .brand{margin-bottom:27px}
  .logo{width:min(310px,82vw)}
  .card{padding:32px 20px 30px;border-radius:15px;min-height:380px}
  .title h1{font-size:23px}
}
</style>
  
</head>

nPg==" alt="La Campana Servicios de Acero">
  </div>

  <div class="title">
    <h1>Dashboard Gerencial</h1>
    <p>Plataforma interna La Campana</p>
  </div>

  <section class="card">
    <h2>Bienvenido</h2>
    <p class="sub">Ingresa para acceder al Dashboard Gerencial</p>

    <form id="loginForm">
      <div class="field">
        <label for="username">Correo</label>
        <div class="input-wrap">
          <input id="username" name="username" type="text" autocomplete="username"
                 placeholder="usuario@lacampana.com" required autofocus>
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="••••••••" required>
          <button type="button" class="toggle-password" id="togglePassword"
                  aria-label="Mostrar contraseña">Mostrar</button>
        </div>
      </div>

      <button id="loginButton" class="login-button" type="submit">Iniciar sesión</button>
      <div id="error" class="error"></div>
    </form>

    <a class="forgot" href="#" onclick="return false;">¿Olvidaste tu contraseña?</a>
  </section>

  <div class="footer">© La Campana Servicios de Acero · Dashboard Gerencial</div>
</main>

<script>
const API_BASE = 'https://panorama-de-producci-n33.onrender.com/api';

document.getElementById('togglePassword').addEventListener('click', () => {
  const password = document.getElementById('password');
  const toggle = document.getElementById('togglePassword');
  if(password.type === 'password'){
    password.type = 'text';
    toggle.setAttribute('aria-label','Ocultar contraseña');
    toggle.textContent = 'Ocultar';
  }else{
    password.type = 'password';
    toggle.setAttribute('aria-label','Mostrar contraseña');
    toggle.textContent = 'Mostrar';
  }
});

if(sessionStorage.getItem('panorama_access_token')){
  fetch(API_BASE + '/auth/me', {
    headers:{Authorization:'Bearer ' + sessionStorage.getItem('panorama_access_token')}
  }).then(response => {
    if(response.ok) window.location.replace('menu.html');
    else sessionStorage.removeItem('panorama_access_token');
  }).catch(()=>{});
}

document.getElementById('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button=document.getElementById('loginButton');
  const error=document.getElementById('error');
  error.style.display='none';
  button.disabled=true;
  button.textContent='VALIDANDO...';
  try{
    const response=await fetch(API_BASE + '/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        username:document.getElementById('username').value.trim(),
        password:document.getElementById('password').value
      })
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.message || 'Usuario o contraseña incorrectos.');
    sessionStorage.setItem('panorama_access_token',data.token);
    window.location.replace('menu.html');
  }catch(err){
    error.textContent=err.message || 'No se pudo conectar con el servidor.';
    error.style.display='block';
  }finally{
    button.disabled=false;
    button.textContent='INGRESAR AL SISTEMA';
  }
});
</script>
