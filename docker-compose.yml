services:
  postgres:
    image: postgres:16-alpine
    container_name: panorama_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: panorama
      POSTGRES_USER: panorama_user
      POSTGRES_PASSWORD: panorama_password
    ports:
      - "5432:5432"
    volumes:
      - panorama_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: panorama_backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://panorama_user:panorama_password@postgres:5432/panorama
      JWT_SECRET: CAMBIA_ESTA_CLAVE_EN_PRODUCCION
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: CambiaEstaClave2026!
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"
    depends_on:
      - postgres

volumes:
  panorama_pgdata:
